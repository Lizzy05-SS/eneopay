<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <div class="Registration">
        <link rel="stylesheet" href="registration.css">

    </div>
</head>
<body>
   <h2 style="background-color: cyan;"> Registration Form</h2>
    <p>Please fill out the form below to register for the event</p>
    <div class="main">
        <div  class="infor">
        <label for="name">full name:</label>
        <input type="text" id="name" name="name"required>
        <label for="phone">phone number:</label>
        <input type="tel" id="phone" name="phone"required>
        <label for="occupation">occupation:</label>
        <input type="text" id="occupation" name="occupation" required>
        <label for="Tech-experience">experience in Tech</label>
        <select id="tech experience" name="tech experience"required>
            <option value="">select an option</option>
            <option value="beginner">beginner</option>
            <option value="intermidiate">intermediate</option>
            <option value="advanced">advanced</option>
        </select>
        <label for="additional-info">Additional information:</label>
        <textarea id="additional-info" name="additional information"></textarea>
        <button >Submit</button>
        </div>
         <img src="Assets/registerlogjpg.jpg" alt="registerlogjpg">
        </div>
</div>
   
</body>
</html>
